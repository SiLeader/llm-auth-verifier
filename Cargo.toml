[package]
name = "llm-auth-verifier"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
license-file = "LICENSE"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

chrono = { version = "0.4.45", features = ["serde"] }
humantime = "2.4.0"

serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.5"
serde_json = "1.0.151"

anyhow = "1.0.104"

regex = "1.13.1"

sha2 = "0.11.0"
hex = "0.4.3"
constant_time_eq = "0.6.0"

jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.5", features = ["json"] }

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

clap = { version = "4.6.6", features = ["derive"] }
