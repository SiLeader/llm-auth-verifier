name: Build Container
on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  publish-container:
    name: Publish Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Rust application version
        id: extract-version
        shell: bash
        run: |
          version=$(cat Cargo.toml | grep -E '^version' | awk '{print $3}' | tr -d '"')
          echo "version=v${version}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish to ghcr.io
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ghcr.io/sileader/llm-auth-verifier:latest
            ghcr.io/sileader/llm-auth-verifier:${{ steps.extract-version.outputs.version }}
            ghcr.io/sileader/llm-auth-verifier:${{ github.sha }}
